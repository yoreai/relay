name: Bug report
description: Something relay did that it shouldn't have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem, please report it privately instead —
        see [SECURITY.md](https://github.com/yoreai/relay/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. relay "…"  (or: which MCP tool the agent called)
        2. …
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `relay doctor`
      description: >
        This covers version, which CLIs are installed and signed in, where each tier
        actually routes on your machine, and catalog freshness — most reports are
        diagnosable from it alone. Redact anything you'd rather not share.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5 / Ubuntu 24.04
  - type: checkboxes
    id: stale-server
    attributes:
      label: Sanity check
      description: >
        The most common false bug: an editor still running a stale relay MCP server
        after an upgrade, so the version answering isn't the version installed.
      options:
        - label: I reloaded my editor (or restarted the MCP server) after upgrading relay
